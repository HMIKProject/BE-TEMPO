  entity.UpdatePaslonRequest:
    properties:
      foto_paslon:
        example: https://...
        type: string
      misi:
        example: 1. Kolaborasi riset
        type: string
      nama_kabinet:
        example: Kabinet Bersama
        type: string
      nama_ketua:
        example: Calon Ketua
        type: string
      nama_wakil:
        example: Calon Wakil
        type: string
      nim_ketua:
        example: "105223001"
        type: string
      nim_wakil:
        example: "105223002"
        type: string
      nomor_urut:
        example: 3
        type: integer
      visi:
        example: Mewujudkan HMIK unggul

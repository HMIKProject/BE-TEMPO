basePath: /api/v1
definitions:
  entity.Anggota:
    properties:
      angkatan:
        type: integer
      cv_url:
        type: string
      departemen:
        $ref: '#/definitions/entity.Departemen'
      dibuat_pada:
        type: string
      diubah_pada:
        type: string
      divisi:
        $ref: '#/definitions/entity.DivisiDepartemen'
      files:
        type: string
      fotoProfil:
        type: string
      idAnggota:
        type: integer
      idDepartemen:
        description: Relasi One-to-Many (Opsional, karena BPH mungkin tidak ada di
          departemen spesifik)
        type: integer
      idDivisi:
        type: integer
      idPengguna:
        description: Nullable untuk Demisioner
        type: integer
      jabatan:
        type: string
      keahlianAnggota:
        description: Relasi One-to-Many ke Tabel Perantara (Pivot)
        items:
          $ref: '#/definitions/entity.KeahlianAnggota'
        type: array
      minatRisetAnggota:
        items:
          $ref: '#/definitions/entity.MinatRisetAnggota'
        type: array
      namaLengkap:
        type: string
      nim:
        type: string
      pengguna:
        $ref: '#/definitions/entity.Pengguna'
      periode:
        type: string
      programStudi:
        type: string
      status:
        description: Pengurus, Magang, Demisioner
        type: string
      tautan:
        type: string
    type: object
  entity.BallotVoterInfo:
    properties:
      nim:
        example: "10123001"
        type: string
      status_memilih:
        example: false
        type: boolean
    type: object
  entity.CardDetail:
    properties:
      card_key:
        type: string
      judul:
        type: string
      keterangan:
        type: string
      pertumbuhan_bulan_ini:
        type: integer
      tautan_aksi:
        description: 'Rute navigasi: "/admin/buku-induk-anggota", dll.'
        type: string
      total:
        type: integer
      warna_tema:
        description: 'Contoh: "blue", "yellow", "green", "orange"'
        type: string
    type: object
  entity.CastVoteRequest:
    properties:
      id_paslon:
        example: 1
        type: integer
    required:
    - id_paslon
    type: object
  entity.CastVoteResponse:
    properties:
      status_vote:
        example: COMPLETED
        type: string
      waktu_tercatat:
        example: "2026-11-04T15:30:00Z"
        type: string
    type: object
  entity.CreatePaslonRequest:
    properties:
      foto_paslon:
        example: https://...
        type: string
      misi:
        example: 1. Kolaborasi riset
        type: string
      nama_kabinet:
        example: Kabinet Bersama
        type: string
      nama_ketua:
        example: Calon Ketua
        type: string
      nama_wakil:
        example: Calon Wakil
        type: string
      nim_ketua:
        example: "105223001"
        type: string
      nim_wakil:
        example: "105223002"
        type: string
      nomor_urut:
        example: 3
        type: integer
      visi:
        example: Mewujudkan HMIK unggul
        type: string
    required:
    - nama_kabinet
    - nama_ketua
    - nama_wakil
    - nim_ketua
    - nim_wakil
    - nomor_urut
    type: object
  entity.CreatePemiraPeriodRequest:
    properties:
      tahun_periode:
        example: 2027/2028
        type: string
      tanggal_mulai:
        type: string
      tanggal_selesai:
        type: string
    required:
    - tahun_periode
    - tanggal_mulai
    - tanggal_selesai
    type: object
  entity.DashboardStatsResponse:
    properties:
      card_total_anggota_aktif:
        allOf:
        - $ref: '#/definitions/entity.CardDetail'

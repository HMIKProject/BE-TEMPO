      nim:
        example: "10123001"
        type: string
    type: object
  entity.ResendOTPRequest:
    properties:
      nim:
        example: "10123001"
        type: string
    required:
    - nim
    type: object
  entity.SetInitialPasswordRequest:
    properties:
      konfirmasi_sandi:
        example: PasswordPribadi123!
        type: string
      password_baru:
        example: PasswordPribadi123!
        minLength: 8
        type: string
      setup_token:
        example: eyJhbGci...
        type: string
    required:
    - konfirmasi_sandi
    - password_baru
    - setup_token
    type: object
  entity.StatItem:
    properties:
      keterangan:
        type: string
      pertumbuhan_bulan_ini:

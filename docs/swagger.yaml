    - nama_wakil
    - nim_ketua
    - nim_wakil
    - nomor_urut
    type: object
  entity.UpdatePemiraScheduleRequest:
    properties:
      tahun_periode:
        example: 2026/2027
        type: string
      tanggal_mulai:
        type: string
      tanggal_selesai:
        type: string
    required:
    - tahun_periode
    - tanggal_mulai
    - tanggal_selesai
    type: object
  entity.UpdatePemiraStatusRequest:
    properties:
      status:
        enum:
        - DRAFT
        - BERJALAN
        - SELESAI
        example: BERJALAN
        type: string
    required:
    - status
    type: object
  entity.VerifyOTPRequest:
    properties:
      kode_otp:
        example: "748291"
        type: string
      nim:
        example: "10123001"
        type: string
    required:
    - kode_otp
    - nim
    type: object
  entity.VerifyOTPResponse:
    properties:
      ballot_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: 15 menit (dalam detik)
        example: 900

          description: Hak suara sudah pernah digunakan atau paslon tidak valid
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "401":
          description: Ballot token tidak valid atau sesi kadaluarsa
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal memproses transaksi suara
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Pemberian Suara di Bilik Suara (Cast Vote)
      tags:
      - Pemira
  /program-kerja:
    get:
      consumes:
      - application/json
      description: Mengembalikan data program kerja, bisa difilter berdasarkan status
        (Mendatang) atau is_unggulan (true/false)
      parameters:
      - description: 'Filter berdasarkan status (Contoh: Mendatang, Terlaksana)'
        in: query
        name: status
        type: string
      - description: Filter berdasarkan apakah proker unggulan (true/false)
        in: query
        name: is_unggulan
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data program kerja
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      summary: Ambil daftar program kerja HMIK
      tags:
      - ProgramKerja
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: Menerima file form-data gambar terverifikasi (JPEG, PNG, WebP,
        GIF max 5MB) dan mengunggahnya ke Cloudinary
      parameters:
      - description: 'File gambar yang akan diunggah (maksimal 5MB, format: jpg, jpeg,
          png, webp, gif)'
        in: formData
        name: image
        required: true
        type: file
      - description: Folder tujuan di Cloudinary (opsional)
        in: query
        name: folder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Gambar berhasil diunggah
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "400":
          description: Input file tidak valid atau ukuran/format ditolak
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "401":
          description: 'Akses Ditolak: Token JWT tidak ditemukan atau tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengunggah ke Cloudinary
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Unggah gambar ke Cloudinary
      tags:
      - Upload
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

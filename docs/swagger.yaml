  entity.VotingStatItem:
    properties:
      keterangan:
        type: string
      sedang_berjalan:
        type: integer
      total:
        type: integer
    type: object
  utils.JSendResponse:
    properties:
      data: {}
      errors:
        items:
          type: string
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/utils.Meta'
      status:
        type: string
    type: object
  utils.Meta:
    properties:
      current_page:
        type: integer
      limit_per_page:
        type: integer
      total_data:
        type: integer
      total_pages:
        type: integer

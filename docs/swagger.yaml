basePath: /api/v1
definitions:
  entity.CardDetail:
    properties:
      card_key:
        type: string
      judul:
        type: string
      keterangan:
        type: string
      pertumbuhan_bulan_ini:
        type: integer
      tautan_aksi:
        description: 'Rute navigasi: "/admin/buku-induk-anggota", dll.'
        type: string
      total:
        type: integer
      warna_tema:
        description: 'Contoh: "blue", "yellow", "green", "orange"'
        type: string
    type: object
  entity.DashboardStatsResponse:
    properties:
      card_total_anggota_aktif:
        allOf:
        - $ref: '#/definitions/entity.CardDetail'
        description: Detail visual kartu spesifik
      card_total_modul:
        $ref: '#/definitions/entity.CardDetail'
      card_total_program_kerja:
        $ref: '#/definitions/entity.CardDetail'
      card_voting_aktif:
        $ref: '#/definitions/entity.CardDetail'
      mahasiswa_aktif:
        $ref: '#/definitions/entity.StatItem'
      modul:
        $ref: '#/definitions/entity.StatItem'
      program_kerja:
        $ref: '#/definitions/entity.StatItem'
      total_mahasiswa_aktif:
        type: integer
      total_modul:
        type: integer
      total_program_kerja:
        type: integer
      voting:
        $ref: '#/definitions/entity.VotingStatItem'
      voting_aktif:
        type: integer
    type: object
  entity.LoginRequest:
    properties:
      identifier:
        description: Bisa berupa Email atau Username
        example: hmik.human.01@hmik.com
        type: string
      password:
        example: Human102230462026
        type: string
    required:
    - identifier
    - password
    type: object
  entity.LoginResponse:
    properties:
      id_pengguna:
        example: 1
        type: integer
      nama_pengguna:
        example: Kepala Divisi
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  entity.StatItem:
    properties:
      keterangan:
        type: string
      pertumbuhan_bulan_ini:
        type: integer
      total:
        type: integer
    type: object
  entity.VotingStatItem:
    properties:
      keterangan:
        type: string
      sedang_berjalan:
        type: integer
      total:
        type: integer
    type: object
  utils.JSendResponse:
    properties:
      data: {}
      errors:
        items:
          type: string
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/utils.Meta'
      status:
        type: string
    type: object
  utils.Meta:
    properties:
      current_page:
        type: integer
      limit_per_page:
        type: integer
      total_data:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact: {}
  description: Dokumentasi API backend HMIK CoreX untuk Halaman Publik & Dashboard
    Admin.
  title: HMIK CoreX API
  version: "1.0"
paths:
  /admin/dashboard/stats:
    get:
      consumes:
      - application/json
      description: Mengembalikan agregasi 4 kartu metrik (Total Anggota Aktif, Total
        Modul, Total Proker, Voting Aktif)
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data ringkasan dashboard
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.DashboardStatsResponse'
              type: object
        "401":
          description: 'Akses Ditolak: Token JWT tidak ditemukan atau tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Ambil seluruh ringkasan kartu Dashboard Admin Halaman Utama
      tags:
      - Dashboard Admin - Halaman Utama
  /auth/login:
    post:
      consumes:
      - application/json
      description: Endpoint untuk mendapatkan JWT Token menggunakan email/username
        dan password
      parameters:
      - description: Kredensial Login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entity.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      summary: Login Pengurus HMIK
      tags:
      - Auth
  /company-profile/team:
    get:
      consumes:
      - application/json
      description: Mengembalikan semua data pengurus HMIK beserta keahlian dan minat
        risetnya
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      summary: Ambil daftar anggota tim HMIK
      tags:
      - Anggota
  /dashboard-admin-halaman-utama/total-anggota-aktif:
    get:
      consumes:
      - application/json
      description: 'Mengembalikan data kartu biru: total anggota berstatus pengurus/magang
        beserta pertumbuhannya'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail kartu Total Anggota Aktif
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.CardDetail'
              type: object
        "401":
          description: 'Akses Ditolak: Token JWT tidak ditemukan atau tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Ambil detail kartu Total Anggota Aktif
      tags:
      - Dashboard Admin - Halaman Utama
  /dashboard-admin-halaman-utama/total-modul:
    get:
      consumes:
      - application/json
      description: 'Mengembalikan data kartu kuning: total modul pembelajaran beserta
        pertumbuhannya'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail kartu Total Modul
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.CardDetail'
              type: object
        "401":
          description: 'Akses Ditolak: Token JWT tidak ditemukan atau tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Ambil detail kartu Total Modul
      tags:
      - Dashboard Admin - Halaman Utama
  /dashboard-admin-halaman-utama/total-program-kerja:
    get:
      consumes:
      - application/json
      description: 'Mengembalikan data kartu hijau: total program kerja himpunan beserta
        pertumbuhannya'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail kartu Total Program Kerja
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.CardDetail'
              type: object
        "401":
          description: 'Akses Ditolak: Token JWT tidak ditemukan atau tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Ambil detail kartu Total Program Kerja
      tags:
      - Dashboard Admin - Halaman Utama
  /dashboard-admin-halaman-utama/voting-aktif:
    get:
      consumes:
      - application/json
      description: 'Mengembalikan data kartu oranye: total voting aktif dan kegiatan
        pemilihan yang sedang berjalan'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail kartu Voting Aktif
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.CardDetail'
              type: object
        "401":
          description: 'Akses Ditolak: Token JWT tidak ditemukan atau tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Ambil detail kartu Voting Aktif
      tags:
      - Dashboard Admin - Halaman Utama
  /departemen:
    get:
      consumes:
      - application/json
      description: Mengembalikan semua data departemen beserta anggota dan program
        kerjanya
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data departemen
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      summary: Ambil daftar departemen HMIK
      tags:
      - Departemen
  /program-kerja:
    get:
      consumes:
      - application/json
      description: Mengembalikan data program kerja, bisa difilter berdasarkan status
        (Mendatang) atau is_unggulan (true/false)
      parameters:
      - description: 'Filter berdasarkan status (Contoh: Mendatang, Terlaksana)'
        in: query
        name: status
        type: string
      - description: Filter berdasarkan apakah proker unggulan (true/false)
        in: query
        name: is_unggulan
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data program kerja
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      summary: Ambil daftar program kerja HMIK
      tags:
      - ProgramKerja
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: Menerima file form-data gambar dan mengunggahnya ke Cloudinary,
        mengembalikan URL gambar
      parameters:
      - description: File gambar yang akan diunggah
        in: formData
        name: image
        required: true
        type: file
      - description: Folder tujuan di Cloudinary (opsional)
        in: query
        name: folder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Gambar berhasil diunggah
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "400":
          description: Input file tidak valid
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengunggah ke Cloudinary
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      summary: Unggah gambar ke Cloudinary
      tags:
      - Upload
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

info:
  contact: {}
  description: API Dokumentasi untuk Backend Sistem Himpunan Mahasiswa Ilmu Komputer
  title: HMIK CoreX API
  version: "1.0"
paths:
  /admin/dashboard/stats:
    get:
      consumes:
      - application/json
      description: Mengembalikan agregasi 4 kartu metrik (Total Anggota Aktif, Total
        Modul, Total Proker, Voting Aktif)
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data ringkasan dashboard
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.DashboardStatsResponse'
              type: object
        "401":
          description: 'Akses Ditolak: Token JWT tidak ditemukan atau tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data dari server
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Ambil seluruh ringkasan kartu Dashboard Admin Halaman Utama
      tags:
      - Dashboard Admin - Halaman Utama
  /admin/pemira/chart:
    get:
      description: Mengembalikan data perolehan suara per paslon secara realtime untuk
        visualisasi grafik batang pleno
      produces:
      - application/json
      responses:
        "200":
          description: Data grafik pemilu berhasil diambil
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.ElectionChartResponse'
              type: object
        "401":
          description: 'Akses Ditolak: Token admin tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "500":
          description: Gagal mengambil data grafik pemilu
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Ambil Data Grafik Perolehan Suara Pemilu (Admin)
      tags:
      - Admin - Pemira
  /admin/pemira/kandidat:
    post:
      consumes:
      - application/json
      description: Mendaftarkan paslon baru beserta visi, misi, dan informasi ketua/wakil
      parameters:
      - description: Data Paslon Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entity.CreatePaslonRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Pasangan calon berhasil ditambahkan
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.Paslon'
              type: object
        "400":
          description: Format request tidak valid atau data gagal disimpan
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "401":
          description: 'Akses Ditolak: Token admin tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Tambah Pasangan Calon Baru (Admin)
      tags:
      - Admin - Pemira
  /admin/pemira/kandidat/{id}:
    delete:
      description: 'Menghapus data paslon (Dilindungi: jika suara sudah masuk, penghapusan
        ditolak demi LUBER JURDIL)'
      parameters:
      - description: ID Paslon
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Pasangan calon berhasil dihapus
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "400":
          description: ID tidak valid atau suara sudah masuk sehingga dilarang dihapus
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "401":
          description: 'Akses Ditolak: Token admin tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Hapus Pasangan Calon (Admin)
      tags:
      - Admin - Pemira
    put:
      consumes:
      - application/json
      description: Memperbarui data paslon yang sudah ada berdasarkan ID
      parameters:
      - description: ID Paslon
        in: path
        name: id
        required: true
        type: integer
      - description: Data Paslon Diperbarui
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entity.UpdatePaslonRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Data pasangan calon berhasil diperbarui
          schema:
            allOf:
            - $ref: '#/definitions/utils.JSendResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.Paslon'
              type: object
        "400":
          description: ID tidak valid atau update gagal
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "401":
          description: 'Akses Ditolak: Token admin tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'
      security:
      - BearerAuth: []
      summary: Perbarui Pasangan Calon (Admin)
      tags:
      - Admin - Pemira
  /admin/pemira/new-period:
    post:
      consumes:
      - application/json

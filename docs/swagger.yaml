  entity.ElectionSettingsResponse:
    properties:
      id_pemira:
        example: 1
        type: integer
      mpik_status:
        example: PENDING
        type: string
      status:
        example: BERJALAN
        type: string
      tahun_periode:
        example: 2026/2027
        type: string
      tanggal_mulai:
        type: string
      tanggal_selesai:
        type: string
      total_paslon:
        example: 2
        type: integer
      total_suara:
        example: 327
        type: integer
      winning_paslon:

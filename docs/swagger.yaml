        type: array
      deskripsi:
        type: string
      dibuat_pada:
        type: string
      diperbarui_pada:
        type: string
      id_departemen:
        type: integer
      id_divisi:
        type: integer
      nama_divisi:
        type: string
      program_kerja:
        description: Relasi One-to-Many
        items:
          $ref: '#/definitions/entity.ProgramKerja'
        type: array
      status_aktif:
        type: boolean
    type: object
  entity.ElectionChartCandidate:
    properties:
      foto_paslon:
        example: https://res.cloudinary.com/.../paslon1.png
        type: string
      id_paslon:
        example: 1
        type: integer
      nama_paslon:

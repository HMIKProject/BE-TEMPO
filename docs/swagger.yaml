  entity.Kabinet:
    properties:
      dibuat_pada:
        type: string
      diperbarui_pada:
        type: string
      id_kabinet:
        type: integer
      is_aktif:
        type: boolean
      logo_kabinet:
        type: string
      misi:
        type: string
      nama_kabinet:
        type: string
      tahun_mulai:
        type: integer
      tahun_selesai:
        type: integer
      tanggal_demis:
        type: string
      tanggal_mulai:
        type: string
      visi:
        type: string

                data:
                  $ref: '#/definitions/entity.Pemira'
              type: object
        "400":
          description: Format request tidak valid atau pemira saat ini masih berjalan
          schema:
            $ref: '#/definitions/utils.JSendResponse'
        "401":
          description: 'Akses Ditolak: Token admin tidak valid'
          schema:
            $ref: '#/definitions/utils.JSendResponse'

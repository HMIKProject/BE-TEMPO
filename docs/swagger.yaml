        type: integer
      total_modul:
        type: integer
      total_program_kerja:
        type: integer
      voting:
        $ref: '#/definitions/entity.VotingStatItem'
      voting_aktif:
        type: integer
    type: object
  entity.Departemen:
    properties:
      anggota:
        items:
          $ref: '#/definitions/entity.Anggota'
        type: array
      deskripsi:
        type: string
      dibuat_pada:
        type: string
      diperbarui_pada:
        type: string
      divisi:
        description: Relasi One-to-Many
        items:
          $ref: '#/definitions/entity.DivisiDepartemen'
        type: array
      id_departemen:
        type: integer
      logo:
        type: string
      nama_departemen:
        type: string
      program_kerja:

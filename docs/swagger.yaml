        type: string
      tahun_periode:
        example: 2026/2027
        type: string
      tanggal_mulai:
        type: string
      tanggal_selesai:
        type: string
    type: object
  entity.RequestOTPRequest:
    properties:
      email_kampus:
        example: 10123001@student.universitaspertamina.ac.id
        type: string
      nim:
        example: "10123001"
        type: string
